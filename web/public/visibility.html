<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملفات المواقع — بصرية الزحف</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --muted:#94a3b8; --a:#16a34a; --b:#65a30d; --c:#ca8a04; --d:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--txt); padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .summary { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
  .pill { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 16px; font-size:13px; }
  .pill b { font-size:18px; display:block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .card-head { display:flex; align-items:center; gap:10px; }
  .badge { border-radius:8px; padding:2px 10px; font-weight:700; font-size:14px; color:#fff; }
  .host { font-weight:700; font-size:15px; }
  .host a { color:var(--txt); text-decoration:none; }
  .meta { font-size:12px; color:var(--muted); }
  .row { display:flex; justify-content:space-between; font-size:12px; border-top:1px solid var(--line); padding-top:8px; }
  .row span:first-child { color:var(--muted); }
  .bar { height:6px; background:#0f172a; border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--a); }
  .fields { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:11px; padding:2px 8px; border-radius:6px; border:1px solid var(--line); color:var(--muted); }
  .chip.on { color:#bbf7d0; border-color:#166534; background:#052e16; }
  .issue { font-size:11px; color:#fca5a5; }
  .empty { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
  <h1>ملفات المواقع — بصرية الزحف</h1>
  <div class="sub">وجّهك الواحد لكل موقع: طريقة الدخول، الاكتشاف والسليكتورات، آخر تشغيل حي، ودرجة النضج.</div>
  <div class="summary" id="summary"></div>
  <div class="grid" id="cards"></div>

<script>
const gradeColor = { A:"#16a34a", B:"#65a30d", C:"#ca8a04", D:"#dc2626" };
const fieldLabels = {
  title:"العنوان", description:"الوصف", price:"السعر", phone:"الهاتف", email:"البريد",
  whatsapp:"واتساب", location:"الموقع", company:"الشركة", breadcrumb:"مسار التنقل", date:"التاريخ"
};

function fmtAge(days) {
  if (days === null) return "لا يوجد تشغيل";
  if (days === 0) return "اليوم";
  if (days === 1) return "أمس";
  if (days < 30) return `${days} يوم`;
  if (days < 365) return `${Math.round(days / 30)} شهر`;
  return `${Math.round(days / 365)} سنة`;
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }

function card(p) {
  const g = p.maturity;
  const cov = p.extraction;
  const run = p.liveRun;
  const entry = p.entry;
  const chips = Object.entries(cov.fields).map(([k, on]) =>
    `<span class="chip ${on ? "on" : ""}">${fieldLabels[k] || k}</span>`).join("");
  const report = run.latestReport;
  const trust = run.verification?.trustScore;
  return `<div class="card">
    <div class="card-head">
      <span class="badge" style="background:${gradeColor[g.grade] || "#64748b"}">${esc(g.grade)}</span>
      <span class="host"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.hostname)}</a></span>
    </div>
    <div class="meta">كيف نَدخلُهُ: <b>${esc(entry?.strategy || "غير مجرّب بعد")}</b>` +
      (entry ? ` · نجاح ${entry.successRate ?? "—"}% (${entry.totalChecks} محاولة)` : "") +
      `</div>
    <div class="meta">التكبير فوق الموقع: <b>${esc(cov.region)}</b> · ${esc(cov.currencies.join(" / ") || "—")}</div>
    <div class="row"><span>آخر تشغيل</span><span>${esc(fmtAge(run.daysSinceLastRun))} · ${run.totalRecords} سجل · ${run.files} ملف</span></div>` +
    (report ? `<div class="row"><span>جودة السجل</span><span>${report.qualityScore ?? "—"}/100</span></div>
    <div style="margin:6px 0 2px" class="empty">حقول السجل المرجعي: عنوان ٪${report.fields?.title?.pct ?? "—"} · سعر ٪${report.fields?.price?.pct ?? "—"} · هاتف ٪${report.fields?.phone?.pct ?? "—"} · بريد ٪${report.fields?.email?.pct ?? "—"}</div>` : `<div class="empty">لا يوجد تقرير زحف محفوظ</div>`) +
    (trust ? `<div class="row"><span>درجة الثقة</span><span>${trust.score}/100 (${trust.grade})</span></div>` : "") +
    `<div class="fields" style="margin-top:4px">${chips}</div>` +
    (report?.issues?.length ? `<div class="issue">` + report.issues.map(esc).join("<br>") + `</div>` : "") +
    (p.insights.count ? `<div class="row"><span>رؤى مرتبطة بالموقع</span><span>${p.insights.count} رؤية</span></div>` : "") +
    `<div class="meta" style="color:${g.reason ? "" : "var(--muted)"}">${esc(g.reason.join(" · "))}</div>
  </div>`;
}

fetch("/api/profile")
  .then(r => r.json())
  .then(d => {
    const s = d.summary;
    document.getElementById("summary").innerHTML =
      `<div class="pill">مواقع مكوّنة<b>${s.configured}</b></div>` +
      `<div class="pill">لها تشغيل محفوظ<b>${s.withLiveRuns}</b></div>` +
      `<div class="pill">مؤشر الجودة الإجمالي<b>${s.overallQuality}/100</b></div>`;
    document.getElementById("cards").innerHTML = d.sites.map(card).join("");
  })
  .catch(e => { document.getElementById("cards").innerHTML = `<div class="empty">تعذّر التحميل: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
