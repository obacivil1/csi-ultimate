<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSI Ultimate Scraper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- System fonts (offline-safe) -->
<style>
/* ── Reset & Variables ── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-primary: #0f1117;
  --bg-secondary: #161922;
  --bg-card: #1c1f2e;
  --bg-card-hover: #242738;
  --bg-input: #0f1117;
  --border: #2a2d3a;
  --border-focus: #3b82f6;
  --text-primary: #e8eaed;
  --text-secondary: #9aa0ab;
  --text-muted: #5f6370;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --accent-glow: rgba(59, 130, 246, 0.15);
  --success: #22c55e;
  --success-bg: rgba(34, 197, 94, 0.1);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.1);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.1);
  --gold: #f59e0b;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Tahoma', sans-serif;
  --mono: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
  --transition: 0.2s ease;
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  user-select: none;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
::selection { background: var(--accent); color: #fff; }

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 52px;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-brand .logo {
  width: 28px;
  height: 28px;
  background: var(--accent);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: #fff;
}
.header-brand h1 {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.header-brand .version {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
  background: var(--bg-card);
  padding: 1px 8px;
  border-radius: 4px;
}
.header-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: all var(--transition);
}
.status-dot.idle { background: var(--text-muted); }
.status-dot.running { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 1.5s infinite; }
.status-dot.done { background: var(--accent); }
.status-dot.error { background: var(--danger); }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* ── Main Content ── */
.main-content {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

/* ── Top Panel ── */
.top-panel {
  padding: 16px 24px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.input-row {
  display: flex;
  gap: 12px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.input-group {
  flex: 1;
  min-width: 200px;
}
.input-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.input-group label .hint {
  font-weight: 400;
  color: var(--text-muted);
  font-size: 11px;
}
.input-group input, .input-group select {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 13px;
  transition: border var(--transition);
  outline: none;
}
.input-group input:focus, .input-group select:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.input-group input::placeholder { color: var(--text-muted); }
.input-group select { cursor: pointer; }
.input-group select option { background: var(--bg-card); }

/* ── Advanced Options ── */
.advanced-toggle {
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--font);
  font-size: 12px;
  cursor: pointer;
  padding: 4px 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: color var(--transition);
}
.advanced-toggle:hover { color: var(--text-secondary); }
.advanced-toggle .arrow { transition: transform var(--transition); display: inline-block; }
.advanced-toggle .arrow.open { transform: rotate(180deg); }
.advanced-options {
  display: none;
  margin-top: 10px;
  padding: 12px;
  background: var(--bg-card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.advanced-options.open { display: block; }
.advanced-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}

/* ── Buttons ── */
.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border: none;
  border-radius: var(--radius);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 0 16px var(--accent-glow); }
.btn-danger {
  background: var(--danger);
  color: #fff;
}
.btn-danger:hover:not(:disabled) { background: #dc2626; }
.btn-secondary {
  background: var(--bg-card);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-secondary:hover:not(:disabled) { background: var(--bg-card-hover); color: var(--text-primary); }
.btn-success {
  background: var(--success);
  color: #fff;
}
.btn-success:hover:not(:disabled) { background: #16a34a; }
.btn-sm {
  padding: 5px 12px;
  font-size: 12px;
}

/* ── Split Panes ── */
.split-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}
.pane {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.pane-left {
  flex: 1;
  border-left: 1px solid var(--border);
}
.pane-right {
  flex: 1;
}
.pane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 36px;
  direction: ltr;
}
.pane-header .title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.pane-header .badge {
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg-card);
  padding: 1px 8px;
  border-radius: 10px;
  font-weight: 500;
}
.pane-body {
  flex: 1;
  overflow: auto;
  padding: 8px;
}

/* ── Log Panel ── */
.log-container {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--text-secondary);
  min-height: 100%;
}
.log-container .log-line {
  padding: 1px 4px;
  border-radius: 2px;
}
.log-container .log-line:hover { background: var(--bg-card); }
.log-container .log-line.info { color: var(--text-secondary); }
.log-container .log-line.success { color: var(--success); }
.log-container .log-line.warn { color: var(--warning); }
.log-container .log-line.error { color: var(--danger); }
.log-container .log-line.accent { color: var(--accent); }
.log-container .log-line.muted { color: var(--text-muted); }
.log-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  font-family: var(--font);
  font-size: 13px;
  text-align: center;
  padding: 40px;
}
.log-empty .icon { font-size: 32px; margin-bottom: 10px; }

/* ── Results Table ── */
.results-container { min-height: 100%; }
.results-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  font-family: var(--font);
  font-size: 13px;
  text-align: center;
  padding: 40px;
}
.results-empty .icon { font-size: 32px; margin-bottom: 10px; }
table.results-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  direction: ltr;
}
table.results-table th {
  position: sticky;
  top: 0;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 11px;
  text-align: right;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.results-table td {
  padding: 5px 8px;
  border-bottom: 1px solid rgba(42,45,58,0.5);
  color: var(--text-primary);
  vertical-align: top;
  max-width: 250px;
  overflow: hidden;
  text-overflow: ellipsis;
}
table.results-table tr:hover td { background: var(--bg-card); }
table.results-table .title-cell {
  font-weight: 500;
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
}
table.results-table .title-cell:hover { text-decoration: underline; }

/* ── Bottom Bar ── */
.bottom-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 40px;
  direction: ltr;
}
.bottom-bar .left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.bottom-bar .right {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  font-size: 12px;
}
.export-buttons {
  display: flex;
  gap: 4px;
}
.export-buttons .btn { font-size: 11px; padding: 4px 10px; }

/* ── Toast ── */
.toast-container {
  position: fixed;
  bottom: 56px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}
.toast {
  padding: 8px 16px;
  border-radius: var(--radius);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  animation: slideUp 0.3s ease;
  pointer-events: auto;
  backdrop-filter: blur(8px);
}
.toast.info { background: var(--accent); color: #fff; }
.toast.success { background: var(--success); color: #fff; }
.toast.error { background: var(--danger); color: #fff; }
.toast.warning { background: var(--warning); color: #000; }
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* ── Keyword Tags ── */
.kw-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  background: var(--accent-glow);
  border: 1px solid var(--accent);
  border-radius: 4px;
  font-size: 11px;
  color: var(--accent);
  font-family: var(--mono);
}
.kw-tag.removable { cursor: pointer; }
.kw-tag.removable:hover { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

/* ── Learning Stats ── */
.learning-badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  font-weight: 500;
}
.learning-badge.good { background: var(--success-bg); color: var(--success); }
.learning-badge.bad { background: var(--danger-bg); color: var(--danger); }

/* ── Responsive tweaks ── */
@media (max-width: 900px) {
  .input-row { flex-direction: column; }
  .split-container { flex-direction: column; }
  .pane-left, .pane-right { flex: none; height: 50%; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="logo">🕸</div>
    <h1>CSI Ultimate Scraper</h1>
    <span class="version">v10.0</span>
  </div>
  <div class="header-status">
    <span id="statusText">جاهز</span>
    <span class="status-dot idle" id="statusDot"></span>
  </div>
</div>

<div class="main-content">
  <div class="top-panel">
    <div class="input-row">
      <div class="input-group" style="flex:2">
        <label>🌐 رابط الموقع <span class="hint">(URL)</span></label>
        <input type="url" id="inputUrl" placeholder="https://www.expatriates.com" dir="ltr">
      </div>
      <div class="input-group" style="flex:1.5">
        <label>🔎 كلمة البحث <span class="hint">(Search)</span></label>
        <input type="text" id="inputSearch" placeholder="driver, accountant, engineer" dir="ltr">
      </div>
    </div>

    <button class="advanced-toggle" onclick="toggleAdvanced()">
      <span>⚙️ الإعدادات المتقدمة</span>
      <span class="arrow" id="advancedArrow">▼</span>
    </button>

    <div class="advanced-options" id="advancedOptions">
      <div class="advanced-grid">
        <div class="input-group">
          <label>📄 أقصى عدد صفحات</label>
          <input type="number" id="inputMaxPages" value="10" min="1" max="100">
        </div>
        <div class="input-group">
          <label>📦 أقصى عدد نتائج</label>
          <input type="number" id="inputMaxAds" value="100" min="1" max="1000">
        </div>
        <div class="input-group">
          <label>⏱ تأخير (مللي)</label>
          <input type="number" id="inputDelay" value="2000" min="500" max="10000" step="100">
        </div>
        <div class="input-group">
          <label>🔍 زيارة صفحات الإعلانات</label>
          <select id="inputVisitPages">
            <option value="true">نعم — تفاصيل أكثر</option>
            <option value="false">لا — أسرع</option>
          </select>
        </div>
        <div class="input-group">
          <label>🧠 توليد كلمات تلقائي</label>
          <select id="inputAutoKeywords">
            <option value="false">إيقاف</option>
            <option value="true">تشغيل</option>
          </select>
        </div>
        <div class="input-group">
          <label>💾 صيغة التصدير</label>
          <select id="inputFormat">
            <option value="excel,json">Excel + JSON</option>
            <option value="excel">Excel فقط</option>
            <option value="json">JSON فقط</option>
            <option value="csv">CSV فقط</option>
            <option value="excel,json,csv">الكل</option>
          </select>
        </div>
      </div>
      <div id="keywordTags" style="margin-top:10px;display:none;">
        <label style="font-size:12px;font-weight:600;color:var(--text-secondary);">🧠 كلمات مولّدة:</label>
        <div id="keywordTagList" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;"></div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnStart" onclick="startScrape()">🚀 بدء السحب</button>
      <button class="btn btn-danger" id="btnStop" onclick="stopScrape()" disabled>⏹ إيقاف</button>
      <button class="btn btn-secondary" id="btnClear" onclick="clearAll()">🗑 مسح</button>
    </div>
  </div>

  <div class="split-container">
    <div class="pane pane-right">
      <div class="pane-header">
        <span class="title">📋 سجل التقدم</span>
        <span class="badge" id="logCount">0 lines</span>
      </div>
      <div class="pane-body">
        <div class="log-container" id="logContainer">
          <div class="log-empty">
            <div>
              <div class="icon">🕸</div>
              <p>أدخل رابط الموقع وكلمة البحث</p>
              <p style="font-size:11px;color:var(--text-muted);margin-top:4px">ثم اضغط "بدء السحب" للبدء</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="pane pane-left">
      <div class="pane-header">
        <span class="title">📊 النتائج</span>
        <span class="badge" id="resultCount">0</span>
      </div>
      <div class="pane-body">
        <div class="results-container" id="resultsContainer">
          <div class="results-empty">
            <div>
              <div class="icon">📊</div>
              <p>لا توجد نتائج بعد</p>
              <p style="font-size:11px;color:var(--text-muted);margin-top:4px">النتائج ستظهر هنا تلقائياً</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="left">
      <div class="export-buttons">
        <button class="btn btn-secondary btn-sm" onclick="exportResults('excel')" disabled id="btnExportExcel">📊 Excel</button>
        <button class="btn btn-secondary btn-sm" onclick="exportResults('csv')" disabled id="btnExportCSV">📄 CSV</button>
        <button class="btn btn-secondary btn-sm" onclick="exportResults('json')" disabled id="btnExportJSON">📋 JSON</button>
      </div>
    </div>
    <div class="right">
      <span id="footerStatus">✨ مستعد</span>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="renderer.js"></script>
</body>
</html>
