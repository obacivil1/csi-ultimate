name: تحديث البيانات

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Without write access the default GITHUB_TOKEN cannot push the refreshed data;
# issues:write lets the failure step open/append a tracking issue.
permissions:
  contents: write
  issues: write

# Never let two data updates push at the same time.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + xml2js
        run: |
          npm install playwright xml2js
          npx playwright install --with-deps chromium

      - name: تحديث المنافسات (Etimad)
        run: node scripts/lead-gen/etimad-update.mjs

      - name: تحديث المشاريع (SaudiGulf RSS)
        run: node scripts/lead-gen/scrape-saudi-gulf-projects.mjs

      - name: بناء قاعدة بيانات المشاريع
        run: node scripts/lead-gen/build-projects-database.mjs

      # Fail loudly if the update produced no (or nearly no) data — an empty
      # dataset would otherwise "succeed" silently and leave the site stale.
      - name: فحص صحة البيانات
        run: |
          node -e "const d=require('./data/etimad_all_tenders.json'); if(!Array.isArray(d)||d.length<1000){ console.error('البيانات فارغة أو ناقصة: '+(Array.isArray(d)?d.length:'غير مصفوفة')); process.exit(1);} console.log('البيانات سليمة: '+d.length+' منافسة');"

      - name: رفع التحديثات
        run: |
          git config user.name 'CSI Bot'
          git config user.email 'bot@csi-ultimate.com'
          git add data
          git diff --staged --quiet || (git commit -m 'تحديث تلقائي للبيانات' && git push)

      # On success, close any stale data-update-failure tracking issue so the
      # board reflects reality (the failure step below only opens/appends, never closes).
      - name: إغلاق بلاغات الفشل القديمة
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'data-update-failure';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ نجح تحديث البيانات في ${new Date().toISOString()} — يُغلق البلاغ تلقائياً.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      # If any step above failed, open (or append to) a tracking issue so the
      # failure is never silent. GitHub also emails on failure by default.
      - name: الإبلاغ عن فشل التحديث
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'data-update-failure';
            const title = '⚠️ فشل التحديث التلقائي للبيانات';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'فشل إجراء **تحديث البيانات**.',
              '',
              `- الفرع: \`${context.ref}\``,
              `- التشغيل: ${runUrl}`,
              `- الوقت: ${new Date().toISOString()}`,
              '',
              'راجع سجل التشغيل، أصلح السبب (غالباً تغيّر في موقع اعتماد)، ثم شغّل الإجراء يدوياً من تبويب Actions.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
