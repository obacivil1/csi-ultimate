version: "3.9"

# CSI-Ultimate production stack
#   docker compose up -d flaresolverr    # just the Cloudflare solver
#   docker compose up -d                 # solver + web server
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: csi-flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: "${FLARE_LOG_LEVEL:-info}"
      TZ: "${TZ:-Asia/Riyadh}"
    # Solves per-request Cloudflare challenges (esp. expatriates.com detail pages).
    # CSI-Ultimate reaches it via CSI_FLARE_URL=http://localhost:8191 (default).

  csi:
    build: .
    image: csi-ultimate:latest
    container_name: csi-ultimate
    restart: unless-stopped
    depends_on:
      - flaresolverr
    ports:
      - "3000:3000"   # web server (web/server.mjs)
    environment:
      PORT: "3000"
      CSI_FLARE_URL: "http://flaresolverr:8191"
      CSI_INDEED_PUBLISHER_ID: "${CSI_INDEED_PUBLISHER_ID:-}"
      CSI_PROXY: "${CSI_PROXY:-}"
      JWT_SECRET: "${JWT_SECRET:-change-me}"
    volumes:
      - ./data:/app/data
      - ./state:/app/state
      - ./config:/app/config
      - ./output:/app/output
      - ./logs:/app/logs
    command: ["node", "web/server.mjs"]
